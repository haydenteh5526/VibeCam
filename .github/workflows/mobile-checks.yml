name: mobile-checks

on:
  push:
  pull_request:

env:
  EXPO_PUBLIC_ENABLE_CLOUD_FEATURES: "false"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: |
          npm ci

      - name: Typecheck
        working-directory: mobile
        run: |
          npx tsc --noEmit

      - name: Unit tests
        working-directory: mobile
        run: |
          npm test

      - name: Export release bundles
        working-directory: mobile
        run: npx expo export --platform all

  ios-build:
    runs-on: macos-15
    env:
      # Match the EAS iPhone image; the runner default may use an older SDK.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify iPhone toolchain
        run: |
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk_version%%.*}" -ge 26

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Verify native colour against photo LUTs
        # Run the real Core Image filter on macOS before compiling the iPhone view.
        working-directory: mobile
        run: |
          npx tsx tools/native-look-fixture.ts "$RUNNER_TEMP/native-look.json"
          swiftc modules/vibecam-video/ios/LookCube.swift tools/native-look-smoke.swift -o "$RUNNER_TEMP/native-look-check"
          "$RUNNER_TEMP/native-look-check" "$RUNNER_TEMP/native-look.json"

      - name: Generate iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install --non-interactive

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Compile iPhone release app without signing
        working-directory: mobile/ios
        run: |
          workspaces=(./*.xcworkspace)
          test -d "${workspaces[0]}"
          workspace="${workspaces[0]}"
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/vibecam-derived" \
            CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/vibecam-derived/Build/Products/Release-iphoneos/$scheme.app"
          test -s "$app/main.jsbundle"
          /usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$app/Info.plist"
