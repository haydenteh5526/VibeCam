name: mobile-checks

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: |
          npm ci

      - name: Typecheck
        working-directory: mobile
        run: |
          npx tsc --noEmit

      - name: Unit tests
        working-directory: mobile
        run: |
          npm test

      - name: Export release bundles
        working-directory: mobile
        run: npx expo export --platform all

  ios-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install --non-interactive

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Compile iOS Simulator app without signing
        working-directory: mobile/ios
        run: |
          workspaces=(./*.xcworkspace)
          test -d "${workspaces[0]}"
          workspace="${workspaces[0]}"
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/vibecam-derived" \
            CODE_SIGNING_ALLOWED=NO build
